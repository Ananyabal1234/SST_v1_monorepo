name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sst
          POSTGRES_PASSWORD: sst
          POSTGRES_DB: sst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sst -d sst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sst:sst@localhost:5432/sst?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters!!
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters!
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      SEED_ADMIN_EMAIL: admin@sst.local
      SEED_ADMIN_PASSWORD: ChangeMeNow!
      SST_QA_PASSWORD: TestUser123!
      VITE_API_BASE_URL: /api/v1

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @sst/shared-types build
      - run: pnpm --filter @sst/shared-utils build
      - run: pnpm --filter @sst/shared-types test
      - run: pnpm --filter @sst/shared-utils test
      - run: pnpm --filter @sst/api prisma:generate
      - run: pnpm --filter @sst/api exec prisma migrate deploy
      - run: pnpm --filter @sst/api prisma:seed
      - run: pnpm --filter @sst/api build
      - run: pnpm --filter recruitment-dashboard build
      - name: Start API
        run: |
          pnpm --filter @sst/api start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "API failed to start"; exit 1
      - name: API integration tests
        run: pnpm --filter @sst/api test:integration
      - name: Install Playwright Chromium
        run: pnpm --filter recruitment-dashboard exec playwright install --with-deps chromium
      - name: Playwright e2e smoke
        run: pnpm --filter recruitment-dashboard test:e2e
        env:
          SST_API_BASE: http://localhost:3000
          # Let Playwright start Vite (with /api proxy); do not set SST_WEB_BASE
